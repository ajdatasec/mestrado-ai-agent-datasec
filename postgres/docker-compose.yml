services:
  postgres:
    image: postgres:16
    container_name: ai-agent-postgres
    restart: unless-stopped

    env_file:
      - .env

    environment:
      POSTGRES_USER: aiagent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: aiagent

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
